<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한글 첫 달 - 달토끼</title>
<meta property="og:title" content="한글 첫 달 - 달토끼">
<meta property="og:description" content="여덟 밤 동안 달을 채우며 한글을 읽어요. 무료, 광고 없음, 가입 없음.">
<meta property="og:type" content="website">
<meta name="description" content="달토끼 한글 첫 달. 여덟 밤 동안 기본 모음부터 겹받침까지 소리 중심으로 한글 떼기를 합니다. 무료, 광고 없음, 가입 없음.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20200%20200'%3E%3Ccircle%20cx='100'%20cy='100'%20r='96'%20fill='%2317324A'/%3E%3Ccircle%20cx='100'%20cy='100'%20r='74'%20fill='%23F5E6BD'/%3E%3Cg%20fill='%2317324A'%3E%3Cpath%20d='M80%20140%20L132%20140%20L125%20164%20L87%20164%20Z'/%3E%3Cellipse%20cx='98'%20cy='118'%20rx='19'%20ry='25'/%3E%3Ccircle%20cx='90'%20cy='88'%20r='13'/%3E%3Cpath%20d='M83%2078%20C76%2060%2074%2044%2081%2038%20C88%2044%2088%2062%2090%2077%20Z'/%3E%3Cpath%20d='M95%2078%20C93%2060%2096%2044%20102%2040%20C106%2048%20101%2064%2099%2078%20Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --meok:#221F1C; --hanji:#EDE3CB; --hanji-deep:#E0D2B2;
  --gamcheong:#17324A; --byeok:#2D6E8E; --juhong:#C1403A;
  --hwang:#E3A93C; --ssuk:#6E8F58; --dalbit:#F5E6BD;
  --display:'Jua',sans-serif; --text:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:anywhere;margin:0;background:var(--hanji);color:var(--meok);font-family:var(--text);
  line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;color:var(--meok)}
header button.back{color:#9DB4C6}
input[type=checkbox]{accent-color:var(--byeok)}
#audioNote{cursor:pointer;display:none;position:fixed;left:12px;right:12px;bottom:74px;z-index:9;
  background:var(--juhong);color:#fff;font-size:14px;line-height:1.5;
  border:3px solid var(--meok);border-radius:12px;padding:10px 14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--byeok);outline-offset:3px}

header{background:var(--gamcheong);color:var(--dalbit);padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .back{color:#9DB4C6;text-decoration:none;font-size:14px;background:none;border:none;padding:0}
header .title{font-family:var(--display);font-size:22px;flex:1}
.moonbar{display:flex;align-items:center;gap:8px;font-size:13px;color:#9DB4C6}
.track{width:130px;height:10px;background:#0E2338;border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--hwang);transition:width .35s}

main{flex:1;display:flex;justify-content:center;padding:26px 18px 124px}
.card{width:100%;max-width:780px}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 4px}
.sub{margin:0 0 20px;color:#5A5248;font-size:15px}

/* 모듈 선택 */
.modgrid{display:flex;flex-wrap:wrap;gap:16px}
.modcard{flex:1 1 220px;border:3px solid var(--meok);border-radius:16px;
  background:var(--dalbit);padding:16px;text-align:left;display:flex;gap:14px;align-items:center}
.modcard:hover{background:var(--hwang)}
.modcard b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.modcard span{font-size:13px;color:#5A5248;display:block}
.modcard .jm{font-size:19px;margin-top:4px;letter-spacing:.08em}
.modcard .night{font-size:12.5px;color:var(--juhong);font-weight:700;display:block}
.modcard.next{border-color:var(--juhong);box-shadow:0 0 0 3px var(--juhong)}
.modcard .here{display:inline-block;font-size:11.5px;background:var(--juhong);color:#fff;
  border-radius:999px;padding:1px 9px;margin-left:6px;font-weight:700;vertical-align:1px}
.parents{margin-top:26px;border-top:2px dashed #B9AB88;padding-top:14px;font-size:14px;color:#5A5248}
.parents b{color:var(--meok)}
.parents button{font-size:13px;border:2px solid var(--meok);border-radius:8px;background:#fff;
  padding:4px 12px;margin-top:8px}

/* 자모 타일 */
.grid{display:flex;flex-wrap:wrap;gap:11px}
.tile{background:var(--dalbit);border:3px solid var(--meok);border-radius:14px;
  width:92px;height:100px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:42px;line-height:1;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile small{font-size:12px;color:#6B6256;min-height:14px}
.tile.vowel{background:#FBF3DC}
.tile.playing{background:var(--hwang)}
.grouplabel{font-size:13px;color:#6B6256;margin:0 0 7px}

/* 획순 */
.strokes{display:flex;flex-wrap:wrap;gap:12px}
.strokebox{border:3px solid var(--meok);border-radius:14px;background:var(--dalbit);
  padding:6px;text-align:center;cursor:pointer}
.strokebox svg{display:block}
.strokebox span{font-size:13px;color:#6B6256}
.animpath{stroke:var(--meok);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* 따라쓰기 */
.tracewrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
#pad{border:3px solid var(--meok);border-radius:14px;background:var(--dalbit);touch-action:none}
.tracepick{display:flex;flex-wrap:wrap;gap:8px;max-width:300px}
.tracepick button{width:58px;height:58px;font-size:27px;border:3px solid var(--meok);
  border-radius:12px;background:#fff}
.tracepick button[aria-pressed="true"]{background:var(--hwang)}

/* 조립 */
.assembly{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.slot{width:78px;height:78px;border:3px dashed var(--meok);border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:40px;background:#FBF3DC}
.slot.filled{border-style:solid;background:var(--dalbit)}
.slot.optional{border-color:#A99C7E}
.eq{font-size:26px;color:#6B6256}
.result-syl{width:104px;height:104px;border:3px solid var(--meok);border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:58px;background:var(--ssuk);
  color:var(--hanji)}
.pickrow{margin-bottom:12px}
.pickrow b{display:block;font-size:13px;color:#6B6256;margin-bottom:6px;font-weight:500}
.chip{font-size:26px;min-width:58px;height:58px;border:3px solid var(--meok);border-radius:12px;
  background:#fff;margin:0 7px 7px 0;padding:0 8px}
.chip[aria-pressed="true"]{background:var(--hwang)}
.chip.new{background:#FBF3DC;border-color:var(--juhong)}

/* 문제 */
.qbig{font-size:20px;margin:0 0 8px}
.qhint{font-size:15px;color:var(--byeok);margin:0 0 16px}
.opts{display:flex;gap:13px;flex-wrap:wrap}
.opt{font-size:42px;min-width:104px;height:104px;border:3px solid var(--meok);
  border-radius:14px;background:var(--dalbit);padding:0 10px}
.opt.right{background:var(--ssuk);color:var(--hanji)}
.opt.wrong{background:var(--juhong);color:var(--hanji)}

/* 단어 */
.words{display:flex;flex-wrap:wrap;gap:14px}
.word{border:3px solid var(--meok);border-radius:14px;background:var(--dalbit);
  padding:10px;width:162px;text-align:center;cursor:pointer}
.word svg{display:block;margin:0 auto}
.word .w{font-size:34px;margin-top:4px;line-height:1.25}
.word .en{font-size:13px;color:#6B6256;min-height:18px}
.word .noimg{height:96px;display:flex;align-items:center;justify-content:center;
  font-size:52px;color:#C3B48C}

/* 소리와 글자 대조 */
.cmp{width:100%;border-collapse:collapse;border:3px solid var(--meok);background:var(--dalbit)}
.cmp th,.cmp td{border:2px solid var(--meok);padding:10px 12px;text-align:center}
.cmp th{background:var(--hanji-deep);font-size:14px;font-weight:500}
.cmp td.sp{font-size:34px}
.cmp td.so{font-size:34px;color:var(--juhong)}
.cmp td.nt{font-size:14px;text-align:left;color:#5A5248}
.cmp button{font-size:13px;border:2px solid var(--meok);border-radius:8px;
  background:#fff;padding:4px 10px}

/* 받아쓰기 */
.dictbox{border:3px solid var(--meok);border-radius:14px;background:var(--dalbit);padding:18px}
.answer{min-height:82px;font-size:48px;letter-spacing:.05em;background:#FBF3DC;
  border:3px solid var(--meok);border-radius:12px;display:flex;align-items:center;
  padding:0 16px;margin:12px 0;flex-wrap:wrap}
.answer.right{background:#D8E6CC;border-color:var(--ssuk)}
.answer.wrong{background:#F3D9D6;border-color:var(--juhong)}
.diff{color:var(--juhong)}

.btn{font-family:var(--display);font-size:19px;padding:12px 26px;border-radius:999px;
  border:3px solid var(--meok);background:var(--hwang);color:var(--meok)}
.btn.quiet{background:#fff}
.btn.play{font-size:16px;padding:9px 18px}
.footbar{position:fixed;left:0;right:0;bottom:0;background:var(--hanji-deep);
  border-top:3px solid var(--meok);padding:12px 20px;display:flex;align-items:center;
  gap:14px;justify-content:space-between}
.feedback{font-size:16px;min-height:24px;font-weight:500}
.feedback.ok{color:#4E6B3C}
.feedback.no{color:var(--juhong)}
.toggle{font-size:13px;color:#5A5248;display:flex;align-items:center;gap:6px}
.note{border-left:5px solid var(--juhong);padding:10px 0 10px 15px;margin-top:18px;
  background:#FBF3DC;font-size:15px}
.stars{font-size:60px;color:var(--hwang);letter-spacing:.1em}
/* 소리 환경 안내 */
.envnote{background:#FBF3DC;border-bottom:3px solid var(--meok);border-left:8px solid var(--juhong);padding:12px 18px}
.envnote b{display:block;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.3}
.envnote p{margin:2px 0 8px;font-size:14.5px;max-width:48em}
.envnote .row{display:flex;gap:8px;flex-wrap:wrap}
.envnote a,.envnote button{font-size:14px;border:2px solid var(--meok);border-radius:999px;background:#fff;
  padding:5px 14px;color:var(--meok);text-decoration:none;font-family:var(--text)}
.envnote .primary{background:var(--hwang)}

/* 빠른 확인 */
.checkcta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-8px 0 22px}
.checkcta span{font-size:13.5px;color:#5A5248}
.modcard .pass{color:#4E6B3C;font-weight:700}
.checknote{font-size:13.5px;color:#5A5248;max-width:520px;margin:0 auto 20px;text-align:left}

/* 캐릭터 안내 */
.guide{display:flex;align-items:flex-end;gap:10px;margin:4px 0 22px}
.guide-fig{flex:0 0 96px}
.guide-fig svg{display:block;width:96px;height:80px}
.bubble{position:relative;background:#fff;border:3px solid var(--meok);border-radius:16px;
  padding:9px 14px 11px;font-size:15.5px;line-height:1.6;max-width:560px}
.bubble::before{content:'';position:absolute;left:-15px;bottom:16px;
  border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:12px solid var(--meok)}
.bubble::after{content:'';position:absolute;left:-9px;bottom:19px;
  border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:8px solid #fff}
.bubble b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:var(--juhong);line-height:1.3}
.guide.side{margin-top:18px}
.guide.side .guide-fig{flex-basis:76px}
.guide.side .guide-fig svg{width:76px;height:64px}
.guide.side .bubble{background:#FBF3DC}
.guide.side .bubble::after{border-right-color:#FBF3DC}
.bubble.solo{margin:0 0 12px}
.bubble.solo::before,.bubble.solo::after{display:none}
.guide.happy .guide-fig{animation:hop .6s ease}
.guide.oops .guide-fig{animation:tilt .7s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}65%{transform:rotate(6deg)}}
.trio{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 14px}
.trio-one{text-align:center;width:104px}
.trio-one svg{display:block;width:104px;height:88px}
.trio-one b{font-family:var(--display);font-weight:400;font-size:19px;display:block;line-height:1.2}
.trio-one span{font-size:12.5px;color:#6B6256}
.scene{position:relative;width:240px;height:220px;margin:0 auto 4px}
.scene .moon{position:absolute;left:40px;top:0}
.scene .tori{position:absolute;left:0;bottom:0}
.scene .tori svg{display:block;width:240px;height:200px}
.scene .pestle{animation:pound .45s ease-in-out 5}
@keyframes pound{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@media (max-width:560px){
  .guide-fig{flex-basis:72px}
  .guide-fig svg{width:72px;height:60px}
  .bubble{font-size:14.5px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media (max-width:560px){
  header{padding:10px 14px;row-gap:6px}
  header .back{order:1}
  .moonbar{order:2;margin-left:auto}
  header .title{order:3;flex-basis:100%;font-size:19px;line-height:1.3}
  .track{width:100px}
  .tile{width:74px;height:86px;font-size:34px}
  .opt{min-width:84px;height:84px;font-size:36px}
  h2{font-size:25px}
}
</style>
</head>
<body>

<header>
  <a class="back" id="siteHome" href="../">달토끼 처음으로</a>
  <button class="back" id="homeBtn">밤 고르기</button>
  <div class="title" id="hdrTitle">한글 첫 달</div>
  <div class="moonbar">
    <span id="stepLabel"></span>
    <div class="track"><i id="trackFill"></i></div>
  </div>
</header>

<div id="envNote" class="envnote" role="region" aria-label="소리 안내" hidden></div>

<main><div class="card" id="card"></div></main>

<div id="audioNote" role="status">이 기기에서는 소리가 안 나와요. 글자와 뜻으로 먼저 해 보고, 소리는 다른 기기에서 들어 보세요. <u>눌러서 닫기</u></div>

<div class="footbar">
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  <div style="display:flex;align-items:center;gap:16px">
    <label class="toggle"><input type="checkbox" id="hintToggle"> 소리 힌트</label>
    <button class="btn" id="nextBtn">다음</button>
  </div>
</div>

/* 그림. 없는 단어는 글자 카드로 넘어갑니다. */

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function compose(cho, jung, jong){
  const ci = CHO.indexOf(cho), ji = JUNG.indexOf(jung), ki = jong ? JONG.indexOf(jong) : 0;
  if(ci < 0 || ji < 0 || ki < 0) return '';
  return String.fromCharCode(0xAC00 + ci*588 + ji*28 + ki);
}
/* ---- 자모의 소리 --------------------------------------------
   음성 엔진에 ㄱ 한 글자를 주면 소리 [그]가 아니라 이름 "기역"을 읽습니다.
   발음 중심으로 가르치려면 소리를 들려줘야 하므로, 자모는 소리 음절로 바꿔서 냅니다.
   첫소리 자음은 ㅡ를 붙여 [그], 모음은 ㅇ을 붙여 [아], 받침은 대표음으로 [윽].
   첫소리 ㅇ은 소리가 없으므로 [으]가 됩니다.                                   */
const JONG_REP = {'ㄱ':'ㄱ','ㄲ':'ㄱ','ㅋ':'ㄱ','ㄳ':'ㄱ','ㄺ':'ㄱ',
  'ㄴ':'ㄴ','ㄵ':'ㄴ','ㄶ':'ㄴ',
  'ㄷ':'ㄷ','ㅅ':'ㄷ','ㅆ':'ㄷ','ㅈ':'ㄷ','ㅊ':'ㄷ','ㅌ':'ㄷ','ㅎ':'ㄷ',
  'ㄹ':'ㄹ','ㄼ':'ㄹ','ㄽ':'ㄹ','ㄾ':'ㄹ','ㅀ':'ㄹ',
  'ㅁ':'ㅁ','ㄻ':'ㅁ','ㅂ':'ㅂ','ㅍ':'ㅂ','ㅄ':'ㅂ','ㄿ':'ㅂ','ㅇ':'ㅇ'};
const JONG_HINT = {'ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅇ':'ng'};
function jamoSound(j, role){
  if(role === 'jung') return compose('ㅇ', j);
  if(role === 'jong') return compose('ㅇ', 'ㅡ', JONG_REP[j] || j);
  return compose(j, 'ㅡ');
}
function jamoHint(j, role){
  if(role === 'jong') return JONG_HINT[JONG_REP[j]] || '';
  if(role === 'cho' && j === 'ㅇ') return 'silent';
  return (JAMO[j] || {}).h || '';
}
function roleOf(j){
  if(!mod) return 'cho';
  if(mod.add.jong.includes(j)) return 'jong';
  if(mod.add.jung.includes(j)) return 'jung';
  return 'cho';
}

/* 이미 만든 음절에 받침만 얹습니다. */
function addJong(syl, jong){
  const c = syl.charCodeAt(0);
  if(c < 0xAC00 || c > 0xD7A3) return syl;
  const ki = JONG.indexOf(jong);
  if(ki < 1) return syl;
  return String.fromCharCode(c - ((c - 0xAC00) % 28) + ki);
}

/* ---- 조사 선택 ----------------------------------------------
   자모는 글자 모양이 아니라 이름의 받침을 따릅니다.
   ㄱ은 기역이라 받침이 있고(ㄱ과), ㅓ는 어라 받침이 없습니다(ㅓ와). */
const JAMO_NAME = {
  'ㄱ':'기역','ㄲ':'쌍기역','ㄴ':'니은','ㄷ':'디귿','ㄸ':'쌍디귿','ㄹ':'리을',
  'ㅁ':'미음','ㅂ':'비읍','ㅃ':'쌍비읍','ㅅ':'시옷','ㅆ':'쌍시옷','ㅇ':'이응',
  'ㅈ':'지읒','ㅉ':'쌍지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히읗',
  'ㄳ':'기역시옷','ㄵ':'니은지읒','ㄶ':'니은히읗','ㄺ':'리을기역','ㄻ':'리을미음',
  'ㄼ':'리을비읍','ㅀ':'리을히읗','ㅄ':'비읍시옷',
  'ㅏ':'아','ㅐ':'애','ㅑ':'야','ㅒ':'얘','ㅓ':'어','ㅔ':'에','ㅕ':'여','ㅖ':'예',
  'ㅗ':'오','ㅘ':'와','ㅙ':'왜','ㅚ':'외','ㅛ':'요','ㅜ':'우','ㅝ':'워','ㅞ':'웨',
  'ㅟ':'위','ㅠ':'유','ㅡ':'으','ㅢ':'의','ㅣ':'이'
};
function jongseong(word){
  if(!word) return -1;
  let last = word[word.length - 1];
  if(JAMO_NAME[last]){ const nm = JAMO_NAME[last]; last = nm[nm.length - 1]; }
  const c = last.charCodeAt(0);
  if(c < 0xAC00 || c > 0xD7A3) return -1;
  return (c - 0xAC00) % 28;
}
const JOSA_PAIR = {
  '은':['는','은'],'는':['는','은'],'이':['가','이'],'가':['가','이'],
  '을':['를','을'],'를':['를','을'],'와':['와','과'],'과':['와','과'],
  '이에요':['예요','이에요'],'예요':['예요','이에요'],'이라':['라','이라']
};
function josa(word, type){
  const j = jongseong(word);
  if(type === '으로' || type === '로') return word + ((j === 0 || j === 8) ? '로' : '으로');
  const p = JOSA_PAIR[type];
  if(!p || j < 0) return word + type;
  return word + (j > 0 ? p[1] : p[0]);
}

/* ---- 누적 자모 ---- */
function poolUpTo(n){
  const pool = {cho:[], jung:[], jong:[]};
  MODULES.slice(0, n).forEach(m => {
    pool.cho.push(...m.add.cho);
    pool.jung.push(...m.add.jung);
    pool.jong.push(...m.add.jong);
  });
  return pool;
}

/* ---- 소리 --------------------------------------------------
   음성 합성은 기기와 브라우저에 따라 예외를 던집니다.
   특히 iOS 는 샌드박스 안에서 접근 자체가 막히기도 하고,
   사용자가 화면을 한 번 누르기 전에는 소리를 내 주지 않습니다.
   그래서 모든 접근을 safe() 로 감싸고, 실패하면 조용히 끕니다.   */
let voiceKo = null, ttsOK = false, ttsUnlocked = false, ttsWarned = false;
function safe(fn){
  try { return fn(); }
  catch(e) { ttsOK = false; return null; }
}
try { ttsOK = typeof speechSynthesis !== 'undefined' && !!speechSynthesis; }
catch(e) { ttsOK = false; }

function loadVoice(){
  safe(() => {
    const vs = speechSynthesis.getVoices() || [];
    voiceKo = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
  });
}
if(ttsOK){
  loadVoice();
  safe(() => speechSynthesis.addEventListener('voiceschanged', loadVoice));
}
/* 첫 손가락 터치에서 소리 잠금을 풀어 둡니다. */
function unlockAudio(){
  if(ttsUnlocked || !ttsOK) return;
  ttsUnlocked = true;
  safe(() => {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  });
}
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);

function audioWarn(){
  if(ttsWarned || envShown) return;
  ttsWarned = true;
  const n = document.getElementById('audioNote');
  if(n){
    n.style.display = 'block';
    n.onclick = () => { n.style.display = 'none'; };
    setTimeout(() => { n.style.display = 'none'; }, 8000);
  }
}
/* ---- 녹음 파일 -----------------------------------------------
   ../audio/manifest.json 이 있으면 녹음된 소리를 먼저 쓰고, 녹음이 없는 말만 음성 합성으로 냅니다.
   녹음 파일은 카카오톡 같은 앱 속 브라우저에서도 재생됩니다.
   파일 이름은 글자의 유니코드 번호입니다. 가는 ac00.wav, 나무는 b098-bb34.wav   */
const AUDIO_BASE = '../audio/';
let CLIPS = null, clipsReady = false;
const clipId = text => [...text].map(c => c.codePointAt(0).toString(16)).join('-');
function onClipsReady(){ clipsReady = true; document.dispatchEvent(new Event('clipsready')); }
try {
  fetch(AUDIO_BASE + 'manifest.json', {cache: 'no-cache'})
    .then(r => r.ok ? r.json() : null)
    .then(j => { if(j && j.clips && typeof j.clips === 'object') CLIPS = j.clips; })
    .catch(() => {})
    .finally(onClipsReady);
} catch(e) { onClipsReady(); }
const clipCache = {};
let playingClip = null;
function clipAudio(text){
  if(!CLIPS || !text) return null;
  const id = clipId(text);
  if(!CLIPS[id]) return null;
  if(!clipCache[id]){ const a = new Audio(AUDIO_BASE + id + '.wav'); a.preload = 'auto'; clipCache[id] = a; }
  return clipCache[id];
}
function playClip(text){
  const a = clipAudio(text);
  if(!a) return false;
  try {
    if(playingClip && playingClip !== a) playingClip.pause();
    if(ttsOK) safe(() => speechSynthesis.cancel());
    a.currentTime = 0;
    const pr = a.play();
    playingClip = a;
    if(pr && pr.catch) pr.catch(() => ttsSpeak(text));
    return true;
  } catch(e) { return false; }
}
function preloadClips(texts){ texts.forEach(t => clipAudio(t)); }

function speak(text){
  if(!text) return;
  if(playClip(text)) return;
  ttsSpeak(text);
}
function ttsSpeak(text){
  if(!ttsOK || !text) return;
  if(playingClip){ try { playingClip.pause(); } catch(e) {} }
  const done = safe(() => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = .8;
    if(voiceKo) u.voice = voiceKo;
    u.onerror = ev => { if(ev && ev.error !== 'interrupted' && ev.error !== 'canceled') audioWarn(); };
    speechSynthesis.speak(u);
    return true;
  });
  if(!done) audioWarn();
}

/* ---- 기초 도구 ---- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k === 'class') el.className = attrs[k];
    else if(k === 'html') el.innerHTML = attrs[k];
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(x => el.append(x));
  return el;
}

const hdrTitle = document.getElementById('hdrTitle');
function setFeedback(msg, kind){

hintToggle.addEventListener('change', () => {

});

let curGuide = null;
function guide(who, text, side){
  const wrap = h('div', {class:'guide' + (side ? ' side' : ''), 'data-who':who});
  wrap.append(h('div', {class:'guide-fig', html: CHAR[who]('')}),
              h('div', {class:'bubble'}, h('b', {}, NAME[who]), h('span', {}, text)));
  if(!side) curGuide = wrap;
  return wrap;
}
function say(who, text){
  return h('div', {class:'bubble solo'}, h('b', {}, NAME[who]), h('span', {}, text));
}
function react(mood){
  if(!curGuide) return;
  const g = curGuide, who = g.dataset.who;
  g.querySelector('.guide-fig').innerHTML = CHAR[who](mood);
  g.classList.remove('happy', 'oops');
  void g.offsetWidth;
  g.classList.add(mood);
  clearTimeout(react.t);
  react.t = setTimeout(() => {
    g.classList.remove('happy', 'oops');
    g.querySelector('.guide-fig').innerHTML = CHAR[who]('');
  }, 1200);
}
function trio(){
  const t = h('div', {class:'trio'});
  [['tori','소리와 쓰기'], ['moi','말 모으기'], ['dami','옛날 이야기']].forEach(([w, role]) => {
    t.append(h('div', {class:'trio-one'},
      h('div', {html: CHAR[w]('')}), h('b', {}, NAME[w]), h('span', {}, role)));
  });
  return t;
}

/* ---- 진도 저장 ----------------------------------------------
   계정 없이 이 기기의 브라우저에만 저장합니다. 이름이나 개인정보는 저장하지 않습니다.
   저장소가 막힌 환경(시크릿 모드, 일부 앱 속 브라우저)에서는 메모리로만 동작합니다.
   키에 버전을 붙여 두어 나중에 형식이 바뀌어도 옛 기록과 충돌하지 않게 합니다.   */
const STORE_KEY = 'daltokki:v1:first-moon';
let canStore = false;
try {
  localStorage.setItem('daltokki:probe', '1');
  localStorage.removeItem('daltokki:probe');
  canStore = true;
} catch(e) { canStore = false; }

function loadStars(){
  const out = {};
  if(!canStore) return out;
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(data && data.stars && typeof data.stars === 'object'){
      for(const k in data.stars){
        const n = Number(k), v = Number(data.stars[k]);
        if(n >= 1 && n <= MODULES.length && v >= 1 && v <= 3) out[n] = Math.round(v);
      }
    }
  } catch(e) {}
  return out;
}
/* start 는 빠른 확인이 정한 시작할 밤입니다. 그 앞의 밤에는 별을 주지 않고,
   "확인으로 통과"로만 표시합니다. 9 는 여덟 밤을 모두 통과했다는 뜻입니다. */
function loadStart(){
  if(!canStore) return 1;
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    const v = Number(data && data.start);
    if(Number.isInteger(v) && v >= 1 && v <= MODULES.length + 1) return v;
  } catch(e) {}
  return 1;
}
function saveStars(){
  if(!canStore) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({stars, start: startNight, updated: Date.now()})); } catch(e) {}
}
function resetStars(){
  for(const k in stars) delete stars[k];
  startNight = 1;
  if(canStore){ try { localStorage.removeItem(STORE_KEY); } catch(e) {} }
}
const stars = loadStars();
let startNight = loadStart();

  const g = h('div', {class:'modgrid'});

      h('div', {style:'flex:1'},

        h('b', {}, m.title),

    resetStars(); showPicker();
  });
  card.append(h('div', {class:'parents'},
    h('b', {}, '부모님께. '),
    '한글 첫 달은 기본 모음에서 겹받침까지 여덟 밤에 걸쳐 한글 떼기를 돕습니다. 순서대로 하는 게 좋지만 아이가 이미 아는 밤은 건너뛰어도 됩니다. ',
    canStore
      ? '진도는 이 기기의 브라우저에만 저장되고, 이름이나 개인정보는 저장하지 않습니다. ' + progressText
      : '이 브라우저에서는 진도가 저장되지 않습니다. 창을 닫으면 기록이 사라집니다.',
    (done || startNight > 1) && canStore ? h('div', {}, resetBtn) : ''
  ));
}

/* 달 모양 ----------------------------------------------------
   n번째 모듈은 전체의 n/8 만큼 찬 달입니다. 모듈 1은 초승달, 모듈 8은 보름달.
   한국과 미국(북반구)에서 차오르는 달은 오른쪽부터 밝아지므로
   밝은 부분 = 오른쪽 반원 + 명암 경계선(타원 호)으로 직접 그립니다.
   가리개 원을 덮는 방식은 바탕색이 바뀌면 테두리 밖으로 삐져나와서 쓰지 않습니다.
   다 한 모듈은 밝은 부분이 금색이 됩니다.                                   */
function moonSVG(n, size, done){
  const f = Math.max(0, Math.min(1, n / MODULES.length));
  const cx = 30, cy = 30, r = 24;
  const litColor = done ? '#E3A93C' : '#F5E6BD';
  let lit;
  if(f >= 1){
    const crater = done ? '#C98E26' : '#DCC894';
    lit = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${litColor}"/>
      <g fill="${crater}"><circle cx="23" cy="23" r="4.5"/><circle cx="37" cy="33" r="3.4"/>
      <circle cx="26" cy="39" r="2.6"/><circle cx="38" cy="20" r="2"/></g>`;
  } else {
    const rx = (r * Math.abs(1 - 2 * f)).toFixed(2);
    const sweep = f > 0.5 ? 1 : 0;   /* 반달 전에는 경계선이 오른쪽으로, 이후에는 왼쪽으로 부풉니다 */
    lit = `<path d="M${cx} ${cy - r} A${r} ${r} 0 0 1 ${cx} ${cy + r} A${rx} ${r} 0 0 ${sweep} ${cx} ${cy - r} Z" fill="${litColor}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#17324A"/>
    ${lit}
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#221F1C" stroke-width="2.5"/>
  </svg>`;
}

/* ---- 모듈 시작 ---- */
function startModule(n){
  mod = MODULES.find(m => m.n === n);
  try { preloadClips(listClips().filter(c => c.night === n).map(c => c.text)); } catch(e) {}
  pool = poolUpTo(n);
  score = 0;
  maxScore = mod.listen.length + mod.dict.length;
  steps = [intro, soundScreen, strokeScreen, traceScreen, buildScreen, listenScreen, wordScreen];
  if(mod.cmp) steps.push(compareScreen);
  steps.push(dictationScreen, resultScreen);
  step = 0;
  setNav(true);
  render();
}

function render(){
  card.innerHTML = '';
  setFeedback('');
  hdrTitle.textContent = nightName(mod.n) + '. ' + mod.title;
  nextBtn.textContent = step === steps.length - 1 ? '밤 고르기' : '다음';
  nextBtn.style.visibility = 'visible';
  document.getElementById('stepLabel').textContent = (step+1) + ' / ' + steps.length;
  document.getElementById('trackFill').style.width = (step/(steps.length-1)*100) + '%';
  curGuide = null;
  steps[step]();
  window.scrollTo(0,0);
}

/* ---- 1. 들어가기 ---- */

  const newJamo = [...mod.add.jung, ...mod.add.cho, ...mod.add.jong];
  card.append(
    h('h2', {}, mod.title),
    guide('tori', mod.why + (mod.note && !mod.cmp && mod.note.w === 'tori' ? ' ' + mod.note.t : '')),
    h('div', {class:'strokebox', style:'display:inline-block;padding:18px 26px;cursor:default'},
      h('div', {style:'font-size:44px;line-height:1.5;letter-spacing:.06em'},
        newJamo.length ? newJamo.join(' ') : '지금까지 배운 받침으로 연습해요')
    ),
  );
  if(mod.note && !mod.cmp && mod.note.w !== 'tori') card.append(guide(mod.note.w, mod.note.t, true));
}

/* ---- 2. 소리 듣기 ---- */
function soundScreen(){
  card.append(h('h2', {}, '소리를 들어 봐요'),
              guide('tori', '내 귀는 아주 커서 소리를 잘 들어. 글자를 누르면 내가 소리 내 줄게. 빨간 테두리가 오늘 새로 만나는 글자야.'));
  const make = (list, cls, label) => {

    return;
  }
  const box = h('div', {class:'strokes'});
  list.forEach(j => {

    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('width','88'); svg.setAttribute('height','88');
    JAMO[j].s.forEach(d => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', d); p.setAttribute('class','animpath');
      svg.append(p);
    });
    const b = h('button', {class:'strokebox', 'aria-label': j + ' 쓰는 순서 보기',
      onclick: () => { animate(svg); speak(jamoSound(j, roleOf(j))); }});
    b.append(svg, h('span', {}, j));
    box.append(b);
    animate(svg);
  });
  card.append(box);
  function animate(svg){
    let delay = 0;
    [...svg.querySelectorAll('path')].forEach(p => {
      const len = p.getTotalLength();
      p.style.transition = 'none';
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      setTimeout(() => {
        p.style.transition = 'stroke-dashoffset .5s linear';
        p.style.strokeDashoffset = 0;
      }, delay + 60);
      delay += 560;
    });
  }
}

function traceScreen(){
  card.append(h('h2', {}, '따라 써 봐요'),
              guide('tori', '옅은 글자 위를 손가락으로 따라 그어 봐. 아까 본 순서대로 쓰면 더 좋아.'));
  const all = [...mod.add.jung, ...mod.add.cho, ...mod.add.jong];
  const list = all.length ? all : pool.jong;
  let current = list[0];
  const canvas = h('canvas', {id:'pad', width:300, height:300, 'aria-label':'따라 쓰기 연습판'});
  const pick = h('div', {class:'tracepick'});
  list.forEach(j => {
    const b = h('button', {'aria-pressed': j === current ? 'true' : 'false', onclick: () => {
      current = j;
      [...pick.children].forEach(c => c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      drawTraceBase(); speak(jamoSound(j, roleOf(j)));
    }}, j);
    pick.append(b);
  });
  card.append(h('div', {class:'tracewrap'}, canvas, pick),
    h('button', {class:'btn quiet play', style:'margin-top:14px', onclick: drawTraceBase}, '지우기'));

  const ctx = canvas.getContext('2d');
  function drawTraceBase(){
    ctx.clearRect(0,0,300,300);
    ctx.fillStyle = '#F5E6BD'; ctx.fillRect(0,0,300,300);
    ctx.strokeStyle = '#D5C69C'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(150,10); ctx.lineTo(150,290);
    ctx.moveTo(10,150); ctx.lineTo(290,150); ctx.stroke();
    ctx.fillStyle = '#CBBB90';
    ctx.font = '220px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(current, 150, 158);
  }
  drawTraceBase();
  let drawing = false;
  const pos = e => { const r = canvas.getBoundingClientRect();
    return [(e.clientX-r.left)*(300/r.width), (e.clientY-r.top)*(300/r.height)]; };
  canvas.addEventListener('pointerdown', e => {
    drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    const [x,y] = pos(e);
    ctx.strokeStyle = '#221F1C'; ctx.lineWidth = 15;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x,y);
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke();
  });
  canvas.addEventListener('pointerup', () => drawing = false);
  canvas.addEventListener('pointerleave', () => drawing = false);
}

    const r = h('div', {class:'pickrow'}, h('b', {}, label));

      const b = h('button', {class:'chip' + (newList.includes(j) ? ' new' : ''),

        ? josa(cho,'와') + ' ' + josa(jung,'와') + ' ' + josa(jong,'이')

  pool = poolUpTo(MODULES.length);
  setNav(true);
  hdrTitle.textContent = '빠른 확인';
  setFeedback('');
  nextBtn.style.visibility = 'hidden';
  document.getElementById('stepLabel').textContent = '';
  const total = CHECK.length + CHECK_DICT.length;
  const bar = p => { document.getElementById('trackFill').style.width = Math.round(p / total * 100) + '%'; };
  let i = 0, stopAt = null;
  intro();

  function intro(){
    card.innerHTML = ''; curGuide = null; bar(0);
    card.append(
      h('h2', {}, '빠른 확인'),
      guide('tori', '한글을 조금 읽을 줄 알아? 몇 문제만 풀어 보면 어느 밤부터 하면 좋을지 알려 줄게. 모르면 모르겠어요를 눌러도 돼. 틀려도 괜찮아.'),
      h('p', {class:'sub'}, '5분이 채 안 걸려요. 소리를 듣고 맞는 글자를 고르면 돼요.'),
      h('button', {class:'btn', onclick: ask}, '시작하기'));
    window.scrollTo(0,0);
  }

  function ask(){
    if(i >= CHECK.length) return dictAsk(0);
    const q = CHECK[i];
    card.innerHTML = ''; curGuide = null; bar(i);
    let locked = false;
    const pick = ok => {
      if(locked) return; locked = true;
      if(ok){ i++; ask(); }
      else { stopAt = q.a; result(q.n); }
    };
    card.append(h('h2', {}, '듣고 골라요'),
      guide('tori', i === 0 ? '잘 듣고 맞는 글자를 골라 봐.' : '좋아, 다음 문제야.'));
    if(q.hint) card.append(h('p', {class:'qhint'}, '힌트. ' + q.hint));
    card.append(h('button', {class:'btn play', style:'margin-bottom:18px', onclick: () => speak(q.a)}, '다시 듣기'));
    const opts = h('div', {class:'opts'});
    shuffled(q.o).forEach(o => opts.append(h('button', {class:'opt', onclick: () => pick(o === q.a)}, o)));
    card.append(opts, h('div', {style:'margin-top:16px'},
      h('button', {class:'btn quiet play', onclick: () => pick(false)}, '모르겠어요')));
    setTimeout(() => speak(q.a), 300);
    window.scrollTo(0,0);
  }

  function dictAsk(k){
    if(k >= CHECK_DICT.length) return result(MODULES.length + 1);
    const item = CHECK_DICT[k];
    card.innerHTML = ''; curGuide = null; bar(CHECK.length + k);
    let pendingCho = null, typed = '';
    card.append(h('h2', {}, '듣고 써 봐요'),
      guide('tori', k === 0 ? '거의 다 왔어. 이번엔 들리는 말을 직접 써 봐. 받침은 글자를 다 만든 다음에 눌러.' : '좋아, 하나 더.'));
    const box = h('div', {class:'dictbox'});
    const ans = h('div', {class:'answer', 'aria-live':'polite'}, '');
    const paint = () => { ans.textContent = typed + (pendingCho || ''); };
    box.append(h('button', {class:'btn play', onclick: () => speak(item.w)}, '다시 듣기'), ans);
    const rC = h('div', {class:'pickrow'}, h('b', {}, '자음'));
    pool.cho.forEach(j => rC.append(h('button', {class:'chip', onclick: () => { pendingCho = j; setFeedback(''); paint(); }}, j)));
    const rV = h('div', {class:'pickrow'}, h('b', {}, '모음'));
    pool.jung.forEach(j => rV.append(h('button', {class:'chip', onclick: () => {
      if(!pendingCho){ setFeedback('자음을 먼저 눌러요.', 'no'); return; }
      typed += compose(pendingCho, j); pendingCho = null; setFeedback(''); paint();
    }}, j)));
    const rJ = h('div', {class:'pickrow'}, h('b', {}, '받침'));
    pool.jong.forEach(j => rJ.append(h('button', {class:'chip', onclick: () => {
      if(!typed){ setFeedback('먼저 글자를 만들어요.', 'no'); return; }
      typed = typed.slice(0, -1) + addJong(typed[typed.length - 1], j); setFeedback(''); paint();
    }}, j)));
    const stop = () => { stopAt = item.w; result(item.n); };
    box.append(rC, rV, rJ, h('div', {style:'display:flex;gap:10px;margin-top:6px;flex-wrap:wrap'},
      h('button', {class:'btn quiet play', onclick: () => { pendingCho = null; typed = typed.slice(0, -1); paint(); }}, '지우기'),
      h('button', {class:'btn quiet play', onclick: stop}, '모르겠어요'),
      h('button', {class:'btn play', onclick: () => { setFeedback(''); typed === item.w ? dictAsk(k + 1) : stop(); }}, '확인')));
    card.append(box);
    setTimeout(() => speak(item.w), 400);
    window.scrollTo(0,0);
  }

  function result(s){
    startNight = s;
    saveStars();
    card.innerHTML = ''; curGuide = null; bar(total); setFeedback('');
    const all = s > MODULES.length;
    const msg = s === 1
      ? '첫째 밤부터 같이 하자. 소리부터 차근차근 익히면 금방 읽게 될 거야.'
      : all
      ? '첫째 달은 벌써 다 알고 있구나. 둘째 달이 열리면 거기서 만나. 그동안 받아쓰기를 더 해 보고 싶으면 일곱째 밤이나 여덟째 밤을 골라 봐.'
      : '벌써 ' + COUNT[s - 2] + ' 밤만큼 달이 차 있어. ' + nightName(s) + '부터 하면 좋겠어. ' + REASON[s - 1];
    const btns = h('div', {style:'display:flex;gap:12px;justify-content:center;flex-wrap:wrap'});
    if(!all) btns.append(h('button', {class:'btn', onclick: () => startModule(s)}, nightName(s) + ' 시작하기'));
    if(s > 1 && !all) btns.append(h('button', {class:'btn quiet', onclick: () => { startNight = 1; saveStars(); startModule(1); }}, '첫째 밤부터 할래요'));
    btns.append(h('button', {class: all ? 'btn' : 'btn quiet', onclick: showPicker}, '밤 고르기'));
    card.append(h('div', {style:'text-align:center;padding-top:6px'},
      h('div', {class:'scene'},
        h('div', {class:'moon', html: moonSVG(Math.min(s - 1, MODULES.length), 160, false)}),
        h('div', {class:'tori', html: CHAR.tori('happy')})),
      h('h2', {}, all ? '첫째 달을 다 알고 있어요' : nightName(s) + '부터 해요'),
      h('div', {style:'max-width:520px;margin:0 auto 12px;text-align:left'}, say('tori', msg)),
      h('p', {class:'checknote'}, '부모님께. 빠른 확인은 참고용입니다. 아이가 어려워하면 앞의 밤으로 돌아가도 괜찮습니다.'
        + (stopAt ? ' 확인이 멈춘 문제는 ' + josa(stopAt, '이에요') + '.' : '')),
      btns));
    window.scrollTo(0,0);
  }
}

/* ══════════════════════════════════════════════════════════════
   소리 환경 안내
   카카오톡 같은 앱 속 브라우저는 음성 합성을 지원하지 않습니다.
   한국어 음성이 없는 기기에서는 브라우저가 오류 없이 조용히 넘어가 버리기도 합니다.
   녹음 파일이 있으면 두 경우 모두 대부분 해결되므로 안내하지 않습니다.
   ══════════════════════════════════════════════════════════════ */
const UA = navigator.userAgent || '';
const ENV = {
  kakao: /KAKAOTALK/i.test(UA),
  ios: /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1),
  android: /Android/i.test(UA),
  windows: /Windows/.test(UA),
  mac: /Macintosh/.test(UA) && !(navigator.maxTouchPoints > 1),
  firefox: /Firefox\//.test(UA)
};
ENV.inapp = ENV.kakao || /Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER\(inapp|DaumApps|; wv\)/i.test(UA)
  || (ENV.ios && !/Safari\//.test(UA));
let envShown = false;

function koVoiceAvailable(){
  try { return (speechSynthesis.getVoices() || []).some(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('ko')); }
  catch(e) { return false; }
}
function copyAddress(btn){
  const url = location.href;
  const ok = () => { btn.textContent = '복사했어요'; };
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(ok, fallback); return; }
  } catch(e) {}
  fallback();
  function fallback(){
    const t = document.createElement('textarea');
    t.value = url; document.body.append(t); t.select();
    try { document.execCommand('copy'); ok(); } catch(e) { btn.textContent = url; }
    t.remove();
  }
}
function clipsComplete(){
  try { return !!CLIPS && listClips().every(c => CLIPS[c.id]); } catch(e) { return false; }
}
function envMessage(){
  if(clipsComplete()) return null;
  if(ENV.kakao) return {title:'카카오톡 안에서 열려 있어요',
    body:'카카오톡 안의 브라우저에서는 소리가 나지 않을 수 있어요. 아래 버튼을 누르거나, 오른쪽 위 더보기 메뉴에서 \u2018다른 브라우저로 열기\u2019를 눌러 주세요.',
    open:'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href)};
  if(ENV.inapp) return {title:'앱 안의 브라우저에서 열려 있어요',
    body:'이 화면에서는 소리가 나지 않을 수 있어요. 메뉴에서 \u2018브라우저로 열기\u2019를 누르거나, 주소를 복사해서 ' + (ENV.ios ? '사파리' : '크롬') + '에 붙여 넣어 주세요.'};
  if(ttsOK && koVoiceAvailable()) return null;
  if(ENV.firefox) return {title:'파이어폭스에서는 한국어 음성을 찾지 못했어요',
    body:'파이어폭스는 기기에 깔린 음성만 쓸 수 있어요. 크롬이나 엣지, 사파리로 열면 소리가 나요.'};
  if(ENV.ios) return {title:'이 기기에서 한국어 음성을 찾지 못했어요',
    body:'설정에서 \u2018음성\u2019을 검색해 한국어 음성을 내려받으면 소리가 나요. 내려받은 뒤에는 이 페이지를 새로 고쳐 주세요.'};
  if(ENV.android) return {title:'이 휴대전화에서 한국어 음성을 찾지 못했어요',
    body:'휴대전화 설정에서 \u2018텍스트 음성 변환\u2019을 찾아 한국어 음성 데이터를 내려받으면 소리가 나요. 크롬 브라우저로 열어 보는 것도 방법이에요.'};
  if(ENV.windows) return {title:'이 컴퓨터에서 한국어 음성을 찾지 못했어요',
    body:'크롬이나 엣지로 열어 보세요. 그래도 소리가 안 나면 윈도우 설정에서 \u2018음성\u2019을 찾아 한국어 음성을 추가해 주세요.'};
  if(ENV.mac) return {title:'이 컴퓨터에서 한국어 음성을 찾지 못했어요',
    body:'시스템 설정에서 \u2018음성\u2019을 검색해 한국어 음성을 추가하거나, 크롬이나 사파리로 열어 보세요.'};
  return {title:'이 브라우저에서 한국어 음성을 찾지 못했어요', body:'크롬이나 사파리로 열어 보세요.'};
}
function showEnvNote(){
  if(envShown) return;
  const m = envMessage();
  if(!m) return;
  envShown = true;
  const box = document.getElementById('envNote');
  box.innerHTML = '';
  const row = h('div', {class:'row'});
  if(m.open) row.append(h('a', {class:'primary', href:m.open}, '다른 브라우저로 열기'));
  if(ENV.inapp){ const c = h('button', {}, '주소 복사'); c.addEventListener('click', () => copyAddress(c)); row.append(c); }
  row.append(h('button', {onclick: () => { box.hidden = true; }}, '닫기'));
  box.append(h('b', {}, m.title), h('p', {}, m.body), row);
  box.hidden = false;
}
/* 녹음 목록과 음성 목록이 둘 다 준비된 뒤에 한 번만 판단합니다. */
(function(){
  let voicesSettled = !ttsOK, fired = false;
  const tryShow = () => { if(!fired && clipsReady && voicesSettled){ fired = true; showEnvNote(); } };
  if(ttsOK){
    const settle = () => { voicesSettled = true; tryShow(); };
    if(koVoiceAvailable()) settle();
    safe(() => speechSynthesis.addEventListener('voiceschanged', () => { if(koVoiceAvailable()) settle(); }));
    setTimeout(settle, 1500);
  }
  document.addEventListener('clipsready', tryShow);
  tryShow();
})();

/* ══════════════════════════════════════════════════════════════
   녹음 목록
   녹음실(record/)이 이 목록을 읽어 갑니다. 화면에서 소리 내는 말이 모두 들어 있습니다.
   글자 조립에서 아이가 자유롭게 만드는 글자는 경우의 수가 너무 많아 빠지고, 음성 합성이 맡습니다.
   ══════════════════════════════════════════════════════════════ */
function listClips(){
  const out = [], seen = new Set();
  const add = (text, night, label, say) => {
    if(!text || seen.has(text)) return;
    seen.add(text);
    out.push({id: clipId(text), text, night, label, say: say || '자연스러운 속도로 한 번'});
  };
  MODULES.forEach(m => {
    m.add.jung.forEach(j => add(jamoSound(j, 'jung'), m.n, j + ' 모음 소리', '모음 소리만 한 번'));
    m.add.cho.forEach(j => add(jamoSound(j, 'cho'), m.n, j + ' 첫소리', j === 'ㅇ' ? '첫소리 ㅇ은 소리가 없어요. [으]만 짧게' : '자음 소리를 [' + jamoSound(j, 'cho') + ']로 짧게'));
    m.add.jong.forEach(j => add(jamoSound(j, 'jong'), m.n, j + ' 받침 소리', '끝을 막듯이 짧게'));
    m.listen.forEach(q => add(q.a, m.n, '듣고 고르기'));
    m.words.forEach(w => add(w.w, m.n, '단어'));
    (m.cmp || []).forEach(c => add(c.s, m.n, '소리와 글자'));
    m.dict.forEach(w => add(w, m.n, '받아쓰기'));
  });
  CHECK.forEach(q => add(q.a, q.n, '빠른 확인'));
  CHECK_DICT.forEach(d => add(d.w, d.n, '빠른 확인 받아쓰기'));
  return out;
}

/* 주소에 ?night=7 처럼 붙이면 그 밤으로 바로 들어갑니다.
   홈 화면의 이어서 하기와, 선생님이 보내는 숙제 링크가 이걸 씁니다.
   ?check=1 이면 빠른 확인으로 들어갑니다. */
const params = new URLSearchParams(location.search);
const qNight = Number(params.get('night'));
if(params.get('check')) startCheck();
else if(Number.isInteger(qNight) && qNight >= 1 && qNight <= MODULES.length) startModule(qNight);
else showPicker();
</script>
